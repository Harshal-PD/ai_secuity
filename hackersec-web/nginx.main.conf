# Main nginx config for DGX / CentOS 7 Docker.
# Newer alpine images write the PID with pwrite() to /run/nginx.pid, which
# the 3.10 kernel rejects (EPERM). Keep the PID on /tmp instead.
worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    include /etc/nginx/conf.d/*.conf;
}
