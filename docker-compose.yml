# Shared by the main Ollama and the replicas (./start.sh --replicas N).
x-ollama: &ollama
  # Pinned: newer releases give GPU discovery a short watchdog, and on the
  # loaded DGX it times out and silently serves the model from CPU.
  image: ollama/ollama:0.9.6
  restart: unless-stopped
  # Run as the non-root host user on shared DGX systems so the process does
  # not show up under root or reference /root/.ollama.
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  # Do not bind 11434 on the DGX host — that port is often already taken by
  # a system Ollama. Services reach it as http://ollama:11434 on the Compose
  # network. Replicas share the model files in the user's .ollama directory.
  volumes:
    - ${OLLAMA_HOST_DIR:-./.ollama}:${OLLAMA_HOST_DIR:-/home/23ucs586/.ollama}
  runtime: nvidia
  healthcheck:
    test: [ "CMD-SHELL", "ollama list || exit 1" ]
    interval: 15s
    timeout: 10s
    retries: 15
    start_period: 60s

x-ollama-env: &ollama-env
  HOME: ${USER_HOME:-/home/23ucs586}
  OLLAMA_MODELS: ${OLLAMA_HOST_DIR:-/home/23ucs586/.ollama}/models
  NVIDIA_DRIVER_CAPABILITIES: compute,utility
  # Unload weights after 5m of inactivity so idle containers do not lock GPU VRAM
  OLLAMA_KEEP_ALIVE: 5m
  OLLAMA_LLM_LIBRARY: cuda_v12
  OLLAMA_VULKAN: "0"
  # Must equal the client's OLLAMA_NUM_CTX or every request reloads the
  # model. The 32k default does not fit next to other users' jobs and splits
  # the model across CPU and GPU.
  OLLAMA_CONTEXT_LENGTH: ${OLLAMA_NUM_CTX:-4096}
  # Concurrent requests per server; VRAM for the KV cache grows with
  # OLLAMA_NUM_PARALLEL x OLLAMA_NUM_CTX (~0.19 MB per token for 14B).
  OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
  OLLAMA_MAX_LOADED_MODELS: "1"

x-joern: &joern
  image: ghcr.io/joernio/joern:nightly
  restart: unless-stopped
  command: [ "joern", "--server", "--server-host", "0.0.0.0", "--server-port", "8080" ]
  healthcheck:
    test: [ "CMD-SHELL", "curl -f http://localhost:8080/ || exit 1" ]
    interval: 15s
    timeout: 5s
    retries: 10
    start_period: 60s

services:
  # ── Redis (Message Broker + Result Backend) ────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Ollama (Local LLM Runtime with GPU) ────────────────────────────────
  ollama:
    <<: *ollama
    environment:
      <<: *ollama-env
      # Set by ./start.sh (emptiest GPU, N emptiest, or all).
      # Falls back to every GPU if you run compose without the script.
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}

  # ── Ollama replicas, one per extra GPU (./start.sh --replicas N) ───────
  ollama-2:
    <<: *ollama
    profiles: [ "replicas" ]
    environment:
      <<: *ollama-env
      NVIDIA_VISIBLE_DEVICES: ${OLLAMA_GPU_2:-1}

  ollama-3:
    <<: *ollama
    profiles: [ "replicas" ]
    environment:
      <<: *ollama-env
      NVIDIA_VISIBLE_DEVICES: ${OLLAMA_GPU_3:-2}

  ollama-4:
    <<: *ollama
    profiles: [ "replicas" ]
    environment:
      <<: *ollama-env
      NVIDIA_VISIBLE_DEVICES: ${OLLAMA_GPU_4:-3}

  # ── Ollama Model Puller (one-shot init container) ──────────────────────
  # qwen2.5-coder:14b is ~9 GB on disk / ~11 GB VRAM at 8k context, so all three
  # board seats share one resident copy and stay well under a 24 GB card.
  ollama-pull:
    image: curlimages/curl:latest
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      sh -c "
        echo 'Pulling qwen2.5-coder:14b model...' &&
        curl -s http://ollama:11434/api/pull -d '{\"name\": \"qwen2.5-coder:14b\"}' &&
        echo 'Model pull complete!'
      "

  # ── Joern CPG Server ───────────────────────────────────────────────────
  joern:
    <<: *joern
    ports:
      - "8080:8080"
    volumes:
      - joern_data:/tmp/joern
      - app_workspace:/app/workspace
    working_dir: /app

  # A Joern server holds one active project, so parallel evaluation workers
  # get a second server. It keeps its CPG workspace out of app_workspace.
  joern-2:
    <<: *joern
    profiles: [ "replicas" ]
    volumes:
      - app_workspace:/app/workspace
    working_dir: /opt/joern-2

  joern-3:
    <<: *joern
    profiles: [ "replicas" ]
    volumes:
      - app_workspace:/app/workspace
    working_dir: /opt/joern-3

  joern-4:
    <<: *joern
    profiles: [ "replicas" ]
    volumes:
      - app_workspace:/app/workspace
    working_dir: /opt/joern-4

  # ── FastAPI Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      - HOME=/tmp/hs_home
      - HF_HOME=/cache/huggingface
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-4096}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - app_workspace:/app/workspace
      - app_data:/app/data
      - db_data:/app/db_data
      - huggingface_cache:/cache/huggingface
      # /api/metrics serves the newest evaluation report from here.
      - ./eval_results:/app/eval_results:ro
    command: [ "uvicorn", "hackersec.main:app", "--host", "0.0.0.0", "--port", "8000" ]

  # ── Celery Worker (same image, different command) ──────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      - HOME=/tmp/hs_home
      - HF_HOME=/cache/huggingface
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-4096}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - app_workspace:/app/workspace
      - app_data:/app/data
      - db_data:/app/db_data
      - huggingface_cache:/cache/huggingface
    command: >
      celery -A hackersec.worker.celery_app worker --loglevel=info --pool=solo --concurrency=2

  # ── Real-world evaluation (opt-in: ./eval.sh start) ────────────────────
  # Runs detached under dockerd, so an SSH/internet drop does not touch it.
  # Every phase checkpoints; a restart or reboot resumes where it stopped.
  eval:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    profiles: [ "eval" ]
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - .env.docker
    environment:
      - HOME=/tmp/hs_home
      - HF_HOME=/cache/huggingface
      # One dataset directory per dataset choice: samples.jsonl is appended
      # to, so ReposVul must not share CVEfixes/VUDENC's directory. Old runs
      # are re-scored with REALWORLD_DATA=realworld.
      - REALWORLD_DIR=/app/workspace/${REALWORLD_DATA:-realworld_python}
      # One directory per run, so a new pipeline version never mixes with
      # (or resumes from) an older run's checkpoints.
      - REALWORLD_RESULTS_DIR=/app/eval_results/${REALWORLD_RUN:-python_v8}
      - SEMGREP_RULES_DIR=/app/workspace/${REALWORLD_DATA:-realworld_python}/semgrep_rules
      - REALWORLD_DATASETS=${REALWORLD_DATASETS:-cvefixes,vudenc,reposvul}
      - REALWORLD_TARGET_REPOSVUL=${REALWORLD_TARGET_REPOSVUL:-1000}
      # llm (default) | strict | all — see hackersec/evaluation/realworld/sources.py
      - REALWORLD_REPOSVUL_LABELS=${REALWORLD_REPOSVUL_LABELS:-llm}
      - REALWORLD_TARGET_CVEFIXES=${REALWORLD_TARGET_CVEFIXES:-500}
      - REALWORLD_TARGET_VUDENC=${REALWORLD_TARGET_VUDENC:-250}
      - REALWORLD_GIT_COMMIT=${REALWORLD_GIT_COMMIT:-unknown}
      # Written to .env by ./start.sh; the defaults are one server, one worker.
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-4096}
      - OLLAMA_BASE_URLS=${OLLAMA_BASE_URLS:-http://ollama:11434}
      - JOERN_BASE_URLS=${JOERN_BASE_URLS:-http://joern:8080}
      - REALWORLD_WORKERS=${REALWORLD_WORKERS:-1}
      # Comparison baselines, not part of the shipped SAST board.
      # function = whole function, no findings; context = plus same-file callers.
      # 0 disables both.
      - REALWORLD_BASELINES=${REALWORLD_BASELINES:-function,context}
    depends_on:
      ollama:
        condition: service_started
      joern:
        condition: service_started
    volumes:
      # Joern imports code by path; /app/workspace is the volume it shares.
      - app_workspace:/app/workspace
      - app_data:/app/data
      - huggingface_cache:/cache/huggingface
      - ./eval_results:/app/eval_results
    command: [ "sh", "/app/hackersec/evaluation/realworld/entrypoint.sh" ]

  # ── React Frontend (nginx) ────────────────────────────────────────────
  frontend:
    build:
      context: ./hackersec-web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    # CentOS 7 overlayfs cannot pwrite(); nginx 1.31 writes the PID that way.
    # tmpfs is a real in-memory fs, so the PID write succeeds.
    tmpfs:
      - /tmp
      - /run
      - /var/run
    security_opt:
      - seccomp:unconfined
    # Overlayfs on CentOS 7 cannot pwrite() files that exist in the image
    # layer (/run/nginx.pid). Start nginx from a fresh config whose PID is /tmp.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        rm -f /run/nginx.pid /var/run/nginx.pid;
        printf '%s\n'
        'worker_processes auto;'
        'error_log stderr notice;'
        'pid /tmp/nginx.pid;'
        'events { worker_connections 1024; }'
        'http { include /etc/nginx/mime.types; default_type application/octet-stream; sendfile on; keepalive_timeout 65; include /etc/nginx/conf.d/*.conf; }'
        > /tmp/nginx.conf
        && exec nginx -c /tmp/nginx.conf -g 'daemon off;'

volumes:
  redis_data:
  ollama_data:
  joern_data:
  app_workspace:
  app_data:
  db_data:
  huggingface_cache:
