services:
  # ── Redis (Message Broker + Result Backend) ────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Ollama (Local LLM Runtime with GPU) ────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=7
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Keep weights resident across the three board seats to avoid a reload per finding
      - OLLAMA_KEEP_ALIVE=30m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '7' ]
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD-SHELL", "ollama list || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  # ── Ollama Model Puller (one-shot init container) ──────────────────────
  # qwen2.5-coder:14b is ~9 GB on disk / ~11 GB VRAM at 8k context, so all three
  # board seats share one resident copy and stay well under a 24 GB card.
  ollama-pull:
    image: curlimages/curl:latest
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      sh -c "
        echo 'Pulling qwen2.5-coder:14b model...' &&
        curl -s http://ollama:11434/api/pull -d '{\"name\": \"qwen2.5-coder:14b\"}' &&
        echo 'Model pull complete!'
      "

  # ── Joern CPG Server ───────────────────────────────────────────────────
  joern:
    image: ghcr.io/joernio/joern:nightly
    restart: unless-stopped
    ports:
      - "8080:8080"
    command: [ "joern", "--server", "--server-host", "0.0.0.0", "--server-port", "8080" ]
    volumes:
      - joern_data:/tmp/joern
      - app_workspace:/app/workspace
    working_dir: /app
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/ || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── FastAPI Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - app_workspace:/app/workspace
      - app_data:/app/data
      - db_data:/app/db_data
      - huggingface_cache:/root/.cache/huggingface
    command: [ "uvicorn", "hackersec.main:app", "--host", "0.0.0.0", "--port", "8000" ]

  # ── Celery Worker (same image, different command) ──────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - app_workspace:/app/workspace
      - app_data:/app/data
      - db_data:/app/db_data
      - huggingface_cache:/root/.cache/huggingface
    command: >
      celery -A hackersec.worker.celery_app worker --loglevel=info --pool=solo --concurrency=2

  # ── React Frontend (nginx) ────────────────────────────────────────────
  frontend:
    build:
      context: ./hackersec-web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  redis_data:
  ollama_data:
  joern_data:
  app_workspace:
  app_data:
  db_data:
  huggingface_cache:
